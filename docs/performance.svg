<text class="m" x="50" y="198.8" font-size="11" text-anchor="end">8x</text>
<line class="g" x1="58" x2="944" y1="129.4" y2="129.4"/>
<text class="m" x="50" y="133.4" font-size="11" text-anchor="end">16x</text>
<line class="g" x1="58" x2="944" y1="64.0" y2="64.0"/>
<text class="m" x="50" y="68.0" font-size="11" text-anchor="end">32x</text>
<line class="b" x1="58" x2="944" y1="390.9" y2="390.9"/>
<line class="b" x1="832" x2="856" y1="28" y2="28"/>
