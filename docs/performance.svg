<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
<title id="t">CSharpPython speed relative to CPython</title>
<desc id="d">Grouped bars for each benchmark script: how many times slower than CPython the interpreter runs on each runtime. A bar above the CPython line is slower, below it is faster. The scale is logarithmic.</desc>
<style>
:root{--bg:#ffffff;--ink:#1f2328;--muted:#656d76;--grid:#d8dee4;--base:#1f2328}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--muted:#8b949e;--grid:#30363d;--base:#e6edf3}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--muted)}.g{stroke:var(--grid);stroke-width:1}.b{stroke:var(--base);stroke-width:1.5;stroke-dasharray:5 3}
</style>
<rect width="960" height="470" fill="var(--bg)"/>
<line class="g" x1="58" x2="944" y1="386.1" y2="386.1"/>
<text class="m" x="50" y="390.1" font-size="11" text-anchor="end">1x</text>
<line class="g" x1="58" x2="944" y1="305.6" y2="305.6"/>
<text class="m" x="50" y="309.6" font-size="11" text-anchor="end">2x</text>
<line class="g" x1="58" x2="944" y1="225.0" y2="225.0"/>
<text class="m" x="50" y="229.0" font-size="11" text-anchor="end">4x</text>
