<text class="m" x="50" y="68.0" font-size="11" text-anchor="end">16x</text>
<line class="b" x1="58" x2="944" y1="386.1" y2="386.1"/>
<line class="b" x1="832" x2="856" y1="28" y2="28"/>
<text x="944" y="33" font-size="12" text-anchor="end">CPython (1x)</text>
